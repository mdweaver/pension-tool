# Pings Supabase every 3 days so a free-tier project is never idle long enough to be paused.
# Reads the project URL and public key from config.js, so no extra secrets are needed.
# Not needed on a paid plan: delete this file then.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 15 */3 * *'   # 15:17 UTC (08:17 Vancouver) every 3rd day of the month
  workflow_dispatch: {}

permissions:
  contents: write             # only for the monthly keep-alive commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database (3 tries)
        run: |
          read -r URL KEY < <(node -e "global.window={}; require('./config.js'); const c=window.CONFIG||{}; console.log((c.SUPABASE_URL||'-')+' '+(c.SUPABASE_ANON_KEY||'-'))")
          if [ "$URL" = "-" ] || [ "$KEY" = "-" ]; then echo "::error::Fill in SUPABASE_URL and SUPABASE_ANON_KEY in config.js first."; exit 1; fi
          for i in 1 2 3; do
            if out=$(curl -fsS --max-time 30 -X POST "${URL%/}/rest/v1/rpc/keepalive_ping" \
                 -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'); then
              echo "Pinged OK at $out"; exit 0
            fi
            echo "Attempt $i failed; retrying in 60s"; sleep 60
          done
          echo "::error::Supabase did not answer. If the project is already paused, restore it from the Supabase dashboard."
          exit 1

  # GitHub turns off scheduled workflows in repos with no commits for 60 days.
  # On the 1st of each month this makes a one-line commit so the schedule keeps running.
  stay-enabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp on the 1st of the month (or when run by hand)
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%d)" != "01" ]; then
            echo "Not the 1st; skipping."; exit 0
          fi
          date -u +"%Y-%m-%dT%H:%MZ" > .github/keepalive-stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-stamp
          git commit -m "chore: keep scheduled workflows enabled" || { echo "Nothing to commit"; exit 0; }
          git push
