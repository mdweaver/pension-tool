# Applies new files in supabase/migrations to your Supabase database whenever they change on main.
# Already-applied migrations are skipped, so re-running is safe.
# Needs three repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD (see README).
name: Deploy database changes

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/deploy-db.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.12

      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret for $v is not set (see README)."; exit 1; fi
          done

      - name: Link to the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show what will be applied
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        run: echo y | supabase db push --password "$SUPABASE_DB_PASSWORD"
