<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sailor Pension Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header class="bar">
  <div class="brand">Sailor Pension Entry <small>Navy pension files</small></div>
  <div class="cur" id="cur"></div>
  <div class="tools">
    <span class="saved" id="saved" aria-live="polite"></span>
    <button class="btn primary" id="b-save" type="button" hidden>Save</button>
    <button class="btn" id="b-records" type="button" hidden>Records</button>
    <button class="btn" id="b-new" type="button" hidden>New record</button>
    <button class="btn" id="b-exp" type="button" hidden>Export</button>
    <button class="btn me" id="b-me" type="button" hidden aria-label="Your account"></button>
  </div>
</header>
<div class="wb">
  <nav class="idx" id="idx" aria-label="Sections"></nav>
  <main id="main"></main>
  <aside class="guide" id="guide" aria-label="Field guide"></aside>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/schema.js"></script>
<script src="js/app.js"></script>
<script src="js/render.js"></script>
<script src="js/views.js"></script>
<script src="js/backend.js"></script>
<script src="js/export.js"></script>
<script src="js/events.js"></script>
</body>
</html>
